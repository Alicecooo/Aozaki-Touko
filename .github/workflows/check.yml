name: Hugo 内容与链接检查
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 安装 Hugo（与 Pages 构建一致）
        env:
          HUGO_VERSION: 0.153.5
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site.py --stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hugo-verification
          path: tests/fixtures/runs/**/manifest.json
