baseURL: https://alicecooo.github.io/Aozaki-Touko/
languageCode: zh-cn
defaultContentLanguage: zh
title: Aozaki Touko
theme: ["PaperMod"]
pagination:
  pagerSize: 12

# Keep article URLs independent of the Markdown topic folders.
permalinks:
  page:
    posts: /posts/:slugorcontentbasename/

taxonomies:
  category: categories
  tag: tags
  topic: topics
  series: series

outputs:
  home: [HTML, RSS, JSON]

# SEO & 构建控制
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# 输出压缩（提升性能）
minify:
  disableXML: true
  minifyOutput: true

markup:
  tableOfContents:
    startLevel: 1
    endLevel: 4
  goldmark:
    renderer:
      unsafe: true

# 核心参数（精简版）
params:
  env: production
  title: Aozaki Touko
  description: "早安、晚安、谢谢、再见！"
  mainSections: [posts, notes]
  keywords: [Blog, Portfolio, PaperMod]
  author: Alicecooo
  defaultTheme: auto
  disableThemeToggle: true
  assets:
    favicon: favicon.svg
  homeEffects: true
  homeIdleSeconds: 30
  articleBackground: plain
  music:
    enabled: true
    autoplay: true
    volume: 0.25

  # 界面展示
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true # 开启代码复制（实用优化）
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: false

  # 首页信息
  homeInfoParams:
    Title: "欢迎回来"
    Content: 早安、晚安、谢谢、再见！
    ImageUrl: /images/Ava.png
    enableList: true

  # 封面控制
  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  showtoc: true # 显示目录
  tocopen: true # 自动展开目录

home:
  sortBy: "date"
  sortOrder: "desc"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: topics
      name: Topics
      url: /topics/
      weight: 20
    - identifier: notes
      name: Notes
      url: /notes/
      weight: 40
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 50

# 代码高亮（保留核心）
pygmentsUseClasses: true
