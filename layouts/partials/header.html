<header class="header">
  <nav class="nav" aria-label="主导航">
    <div class="logo"><a href="{{ "" | absLangURL }}">{{ site.Title }}</a></div>
    <ul id="menu">{{ range site.Menus.main }}
        {{ $active := or ($.IsMenuCurrent "main" .) (eq $.RelPermalink (.URL | relURL)) (and (ne .Identifier "home") (eq $.Section .Identifier)) }}
        <li><a href="{{ .URL | relURL }}" {{ if $active }}aria-current="page"{{ end }}><span {{ if $active }}class="active"{{ end }}>{{ .Name }}</span></a></li>
      {{ end }}
      <li><a class="kb-search-link" href="{{ "search/" | relURL }}" aria-label="搜索" title="搜索"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></a></li>
    </ul>
  </nav>
</header>
