{{ if in site.Params.mainSections .Section }}
<div class="kb-article-context">
  <div class="kb-chips">{{ range .GetTerms "topics" }}<a href="{{ .RelPermalink }}">{{ .Title }} ↗</a>{{ end }}</div>
  {{ if gt .Lastmod .Date }}<p class="kb-muted">更新于 <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "2006-01-02" }}</time></p>{{ end }}
</div>
{{ end }}
