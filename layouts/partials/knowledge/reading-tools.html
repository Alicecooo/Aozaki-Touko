{{ $background := .Params.article_background | default site.Params.articleBackground | default "plain" }}
{{ if not (in (slice "plain" "grid" "dusk" "paper") $background) }}{{ errorf "%s: 无效的 article_background: %s" .File.Path $background }}{{ end }}
<div class="kb-reading-tools" data-default-background="{{ $background }}">
  <button id="kb-background-toggle" type="button" aria-label="切换文章背景" aria-controls="kb-background-menu" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg><span>背景</span></button>
  <div id="kb-background-menu" class="kb-popover" hidden>
    <div class="kb-background-options" role="group" aria-label="文章背景">
      <button type="button" data-background="plain" aria-pressed="false"><span class="kb-swatch kb-swatch-plain"></span>默认</button>
      <button type="button" data-background="grid" aria-pressed="false"><span class="kb-swatch kb-swatch-grid"></span>网格</button>
      <button type="button" data-background="dusk" aria-pressed="false"><span class="kb-swatch kb-swatch-dusk"></span>暮色</button>
      <button type="button" data-background="paper" aria-pressed="false"><span class="kb-swatch kb-swatch-paper"></span>纸页</button>
    </div>
    <button class="kb-background-reset" type="button">恢复文章默认</button>
  </div>
</div>
